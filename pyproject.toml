[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ToLivePhoto"
version = "1.0.0"
description = "Windows native desktop studio for converting videos to iPhone Live Photos with RIFE optical-flow interpolation, out-of-bounds canvas padding, and USB DCIM export"
authors = [{ name = "Arrow36" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "pillow-heif>=1.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "psutil>=5.9",
    "win32-setctime>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["tolivephoto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
